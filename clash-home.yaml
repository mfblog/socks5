mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
authentication: [""]
allow-lan: true
mode: Rule
log-level: info
ipv6: true
external-controller: :9999
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip"
secret: 
# 手机端需要 TUN/VPN 才能接管其他 App 的流量；sing-box 中对应 tun-in + auto_route
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
# en0 是桌面端网卡名，手机端不要固定接口；让内核自动识别当前网络接口
experimental: {ignore-resolve-fail: true}

find-process-mode: "off"
routing-mark: 7894
unified-delay: true
dns:
  enable: true
  listen: :1053
  use-hosts: true
  ipv6: true
  default-nameserver: [ 223.5.5.5, 2400:3200::1 ]
  direct-nameserver: [ 223.5.5.5, 1.2.4.8 ]
  enhanced-mode: fake-ip
  # 与 sing-box 的 198.18.x.x fake-IP 思路一致；28.0.0.0/8 会占用真实公网地址段，不建议使用
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fc00::/18
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'localhost'
  nameserver: [ 223.5.5.5, 1.2.4.8 ]
use-system-hosts: true
hosts:
  'time.android.com': 203.107.6.88
  'time.facebook.com': 203.107.6.88
  'services.googleapis.cn': services.googleapis.com
  'localhost': 127.0.0.1
